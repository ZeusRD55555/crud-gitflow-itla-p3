{% extends 'base.html' %}
{% block title %}Items{% endblock %}
{% block content %}
    <a href="{{ url_for('main.create') }}" class="btn">Nuevo Item</a>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for item in items %}
            <tr>
                <td>{{ item.id }}</td>
                <td>{{ item.name }}</td>
                <td>{{ item.description or '' }}</td>
                <td>
                    <a href="{{ url_for('main.edit', id=item.id) }}" class="btn btn-edit">Editar</a>
                    <form action="{{ url_for('main.delete', id=item.id) }}" method="POST" style="display:inline;">
                        <button type="submit" class="btn btn-delete" onclick="return confirm('¿Eliminar este item?')">Eliminar</button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4">No hay items registrados.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
